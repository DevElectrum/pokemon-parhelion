name: Parhelion • Emerald baseline

on:
  push:
    branches: [master]
  pull_request:

env:
  GAME_VERSION: EMERALD
  GAME_REVISION: 0
  GAME_LANGUAGE: ENGLISH
  COMPARE: 0
  UNUSED_ERROR: 1
  DEPRECATED_ERROR: 1

jobs:
  build-emerald:
    name: Build and validate Emerald ROM
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install ARM toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential binutils-arm-none-eabi gcc-arm-none-eabi libnewlib-arm-none-eabi libpng-dev python3

      - name: Build Emerald base
        run: make -j"$(nproc)" -O all

      - name: Verify generated ROM container and print SHA-256
        shell: bash
        run: |
          test -s pokeemerald.gba
          python3 - <<'PY'
          from pathlib import Path
          rom = Path("pokeemerald.gba").read_bytes()
          assert 0xC0 <= len(rom) <= 32 * 1024 * 1024, f"invalid standard GBA ROM size: {len(rom)}"
          title = rom[0xA0:0xAC].rstrip(b"\\x00 ")
          assert title, "missing GBA header title"
          print(f"ROM size: {len(rom)} bytes; header title: {title!r}")
          PY
          sha256sum pokeemerald.gba
